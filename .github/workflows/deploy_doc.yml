name: Deploy Documentation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'site_root/**'
      - 'tests/test_docs_site.py'
      - 'src/**'
      - 'openapi/schemas/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'CNAME'
      - '.github/workflows/deploy_doc.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAPIDATA_DISABLE_OTLP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group docs --frozen
      - run: uv run python -m pytest tests/test_docs_site.py
      - run: uv run --group docs mkdocs build
      - run: uv run python scripts/prepare_docs_site.py --site site --previous published
      - run: uv run python scripts/build_public_openapi.py site/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
          include-hidden-files: true

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: site
      - name: Publish complete documentation site
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='/.git' site/ published/
          cd published
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish current documentation at root"
            git push origin HEAD:gh-pages
          fi
      - name: Build GitHub Pages and wait for publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published_sha=$(git -C published rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          for attempt in $(seq 1 30); do
            build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
            if [ "$(jq -r .commit <<< "$build")" = "$published_sha" ]; then
              case "$(jq -r .status <<< "$build")" in
                built) exit 0 ;;
                errored) jq .error <<< "$build"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "GitHub Pages did not publish $published_sha within five minutes."
          exit 1
